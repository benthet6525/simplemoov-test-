<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AccessiRoute - Démo Multimodale</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        #sidebar {
            width: 360px;
            background: #ffffff;
            padding: 20px;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
        }

        #map {
            flex: 1;
            height: 100%;
        }

        h1 {
            font-size: 1.4rem;
            color: #1e293b;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #64748b;
        }

        select, button {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            font-size: 0.95rem;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #1d4ed8;
        }

        #instructions-container {
            display: none;
            margin-top: 10px;
            border-top: 1px solid #e2e8f0;
            padding-top: 15px;
        }

        .instruction-step {
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 6px;
            border-left: 4px solid #cbd5e1;
            font-size: 0.9rem;
            background: #f8fafc;
        }

        .badge-line {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            color: white;
            font-weight: bold;
            font-size: 0.75rem;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <h1>♿ AccessiRoute</h1>
        <p style="font-size: 0.85rem; color: #64748b;">Itinéraires accessibles intégrant le réseau piéton réel et les transports en commun.</p>
        
        <div class="form-group">
            <label for="profil">Profil de mobilité :</label>
            <select id="profil">
                <option value="pmr">Fauteuil Roulant / PMR (Accès Garanti)</option>
                <option value="standard">Standard (Option rapide)</option>
            </select>
        </div>

        <button onclick="lancerCalcul()">Calculer l'itinéraire</button>

        <div id="instructions-container">
            <h3>Feuille de route :</h3>
            <div id="steps-list" style="margin-top: 10px;"></div>
        </div>
    </div>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // 1. Initialisation de la carte (Centrée sur Paris)
        var map = L.map('map').setView([48.8566, 2.3522], 13);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Groupe de calques pour nettoyer la carte à chaque nouvelle recherche
        var activeLayerGroup = L.layerGroup().addTo(map);

        // Points de démo fixes (ex: Châtelet -> Bastille)
        var pointDepart = { lat: 48.8584, lng: 2.3470, nom: "Châtelet" };
        var pointArrivee = { lat: 48.8530, lng: 2.3690, nom: "Bastille" };

        function lancerCalcul() {
            var profilSelectionne = document.getElementById('profil').value;
            tracerTrajetMultimodalAdapte(pointDepart, pointArrivee, profilSelectionne);
        }

        // 2. MOTEUR MULTIMODAL AVEC ROUTAGE PIÉTON DÉDIÉ (OSRM)
        async function tracerTrajetMultimodalAdapte(dep, arr, profil) {
            // Réinitialisation du calque de carte
            activeLayerGroup.clearLayers();

            // Calcul de points intermédiaires pour simuler la correspondance transport
            var mid1Lat = dep.lat + (arr.lat - dep.lat) * 0.35;
            var mid1Lng = dep.lng + (arr.lng - dep.lng) * 0.35;

            var mid2Lat = arr.lat + (dep.lat - arr.lat) * 0.15;
            var mid2Lng = arr.lng + (dep.lng - arr.lng) * 0.15;

            try {
                // A. Vrai trajet piéton du départ jusqu'à la 1ère station (OSRM Foot API)
                var res1 = await fetch(`https://router.project-osrm.org/route/v1/foot/${dep.lng},${dep.lat};${mid1Lng},${mid1Lat}?geometries=geojson`);
                var data1 = await res1.json();
                var coordsMarche1 = data1.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);

                L.polyline(coordsMarche1, { color: "#10b981", weight: 5, dashArray: '6, 8' }).addTo(activeLayerGroup);

                // B. Trajet en Transport en commun (Bus PMR ou Métro selon profil)
                var transportLine = [
                    [mid1Lat, mid1Lng],
                    [mid2Lat, mid2Lng]
                ];
                var couleurLigne = (profil === 'pmr') ? "#0055c8" : "#673ab7";
                var nomTransport = (profil === 'pmr') ? "Bus Ligne 95 (100% Accessible)" : "Métro Ligne 14";
                var codeTransport = (profil === 'pmr') ? "BUS 95" : "M14";

                L.polyline(transportLine, { color: couleurLigne, weight: 8, opacity: 0.9 }).addTo(activeLayerGroup);

                // C. Vrai trajet piéton de la 2ème station jusqu'à l'arrivée (OSRM Foot API)
                var res2 = await fetch(`https://router.project-osrm.org/route/v1/foot/${mid2Lng},${mid2Lat};${arr.lng},${arr.lat}?geometries=geojson`);
                var data2 = await res2.json();
                var coordsMarche2 = data2.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);

                L.polyline(coordsMarche2, { color: "#10b981", weight: 5, dashArray: '6, 8' }).addTo(activeLayerGroup);

                // D. Ajout des marqueurs de repère
                L.marker([dep.lat, dep.lng]).addTo(activeLayerGroup).bindPopup(`<b>Départ :</b> ${dep.nom}`);
                L.marker([arr.lat, arr.lng]).addTo(activeLayerGroup).bindPopup(`<b>Arrivée :</b> ${arr.nom}`);

                L.circleMarker([mid1Lat, mid1Lng], { radius: 7, fillColor: "#fff", color: couleurLigne, weight: 3 }).addTo(activeLayerGroup)
                 .bindPopup(`<b>Embarquement :</b> ${nomTransport}`);
                L.circleMarker([mid2Lat, mid2Lng], { radius: 7, fillColor: "#fff", color: couleurLigne, weight: 3 }).addTo(activeLayerGroup)
                 .bindPopup(`<b>Débarquement :</b> ${nomTransport}`);

                // E. Affichage des étapes textuelles
                document.getElementById('steps-list').innerHTML = `
                    <div class="instruction-step" style="border-left-color: #10b981;">
                        🚶 <strong>Marche d'approche :</strong> Suivre la voie piétonne jusqu'à l'arrêt.
                    </div>
                    <div class="instruction-step" style="border-left-color: ${couleurLigne};">
                        <span class="badge-line" style="background-color: ${couleurLigne};">${codeTransport}</span><br>
                        <strong>${nomTransport}</strong><br>
                        <small style="color: #059669;">✔ Ascenseurs & accès de plain-pied vérifiés</small>
                    </div>
                    <div class="instruction-step" style="border-left-color: #10b981;">
                        🚶 <strong>Marche finale :</strong> Voie piétonne adaptée jusqu'à ${arr.nom}.
                    </div>
                `;
                document.getElementById('instructions-container').style.display = "block";

                // F. Ajustement automatique du zoom pour englober tout le tracé
                var ensembleTraces = coordsMarche1.concat(transportLine).concat(coordsMarche2);
                var bounds = L.polyline(ensembleTraces).getBounds();
                map.fitBounds(bounds, { padding: [50, 50] });

            } catch (err) {
                console.error("Erreur lors du calcul du tracé :", err);
                alert("Impossible de calculer l'itinéraire piéton. Vérifie ta connexion réseau.");
            }
        }

        // Exécution au chargement initial
        lancerCalcul();
    </script>
</body>
</html>
