<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimpleMoov - Démo Interactive AccessiRoute</title>
    <link rel="stylesheet" href="style.css">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --primary: #6366f1;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 1rem 5%; background: var(--card-bg); border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        header nav ul { display: flex; list-style: none; gap: 1.5rem; align-items: center; }
        header nav ul li a { text-decoration: none; color: var(--text-muted); font-size: 0.9rem; transition: color 0.2s; }
        header nav ul li a:hover, header nav ul li a.active { color: var(--text-main); }
        .btn-cta { background: var(--primary); padding: 0.5rem 1rem; border-radius: 6px; color: white !important; font-weight: 600; }
        
        .demo-container { max-width: 1200px; margin: 2rem auto; padding: 0 5%; }
        .map-layout {
            display: grid; grid-template-columns: 380px 1fr; gap: 2rem;
            background: var(--card-bg); border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.05); margin-top: 1.5rem;
        }
        .map-sidebar {
            padding: 2rem; background: rgba(15, 23, 42, 0.7); border-right: 1px solid rgba(255, 255, 255, 0.05);
            display: flex; flex-direction: column; gap: 1.2rem; max-height: 680px; overflow-y: auto;
            border-radius: 16px 0 0 16px;
        }
        .filter-group label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.4rem; }
        .filter-group select, .filter-group input {
            width: 100%; padding: 0.7rem; border-radius: 8px; background: var(--bg-color);
            border: 1px solid rgba(255, 255, 255, 0.1); color: var(--text-main); font-size: 0.9rem;
        }
        .checkbox-group {
            display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; color: var(--text-main);
            background: rgba(99, 102, 241, 0.1); padding: 0.8rem; border-radius: 8px; border: 1px solid rgba(99, 102, 241, 0.3);
        }
        .route-instructions {
            background: rgba(15, 23, 42, 0.95); border: 1px solid rgba(99, 102, 241, 0.4);
            border-radius: 10px; padding: 1rem; font-size: 0.85rem; color: var(--text-muted);
        }
        .instruction-step {
            margin-bottom: 0.8rem; padding: 0.6rem; border-radius: 6px; background: rgba(255, 255, 255, 0.03); border-left: 4px solid var(--primary);
        }
        .badge-line {
            display: inline-block; padding: 2px 7px; border-radius: 4px; color: #fff; font-weight: bold; font-size: 0.8rem; margin-right: 6px;
        }
        #map { width: 100%; height: 680px; background: #1e293b; border-radius: 0 16px 16px 0; }
        .loading-text { color: var(--primary); font-size: 0.9rem; font-weight: bold; display: none; }
        footer { text-align: center; padding: 2rem; color: var(--text-muted); font-size: 0.85rem; }

        @media (max-width: 900px) {
            .map-layout { grid-template-columns: 1fr; }
            #map { height: 450px; border-radius: 0 0 16px 16px; }
            .map-sidebar { border-radius: 16px 16px 0 0; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <a href="index.html" style="text-decoration: none; color: white;"><h1>SimpleMoov</h1></a>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Accueil</a></li>
                <li><a href="fonctionnalites.html">Fonctionnalités</a></li>
                <li><a href="demo.html" class="active">Démo Live</a></li>
                <li><a href="contact.html" class="btn-cta">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="demo-container">
        <h2>Démo Interactive d'AccessiRoute</h2>
        
        <div class="map-layout">
            <div class="map-sidebar">
                <h3>Paramètres du Trajet</h3>
                
                <div class="filter-group">
                    <label for="profile-select">Profil de Mobilité :</label>
                    <select id="profile-select">
                        <option value="pmr">Fauteuil Roulant (PMR) - Réseau Accessible</option>
                        <option value="malvoyant">Déficience Visuelle</option>
                        <option value="senior">Senior / Mobilité réduite</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="departure">Point de départ (Île-de-France) :</label>
                    <input type="text" id="departure" value="Gare Montparnasse, Paris" placeholder="Ex: Gare de Lyon, Châtelet...">
                </div>

                <div class="filter-group">
                    <label for="destination">Point d'arrivée (Île-de-France) :</label>
                    <input type="text" id="destination" value="Musée du Louvre, Paris" placeholder="Ex: Tour Eiffel, La Défense...">
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="use-transit" checked>
                    <label for="use-transit">Multimodal (Métro, RER, Bus, Tram)</label>
                </div>

                <button id="btn-calculer" class="btn-primary" style="width: 100%; padding: 10px; cursor: pointer; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: bold;" onclick="calculerItineraire()">Calculer l'itinéraire réel</button>
                <div id="loading-indicator" class="loading-text">Interrogation des serveurs IDFM en cours...</div>

                <div id="instructions-container" class="route-instructions" style="display: none;">
                    <h4 style="color: white; margin-bottom: 10px;">Feuille de route Multimode :</h4>
                    <div id="steps-list"></div>
                </div>
            </div>

            <!-- Conteneur de la Carte -->
            <div id="map"></div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 SimpleMoov (AccessiRoute). Tous droits réservés.</p>
    </footer>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script>
        const IDFM_API_KEY = "zOTwROW5XQ4sWfbtreradCC4PGIFGcoV";
        
        var map = L.map('map').setView([48.8566, 2.3522], 12);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        var activeLayerGroup = L.layerGroup().addTo(map);

        async function geocoderAdresse(adresseTexte) {
            var url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(adresseTexte + ", Île-de-France, France")}&limit=1`;
            var res = await fetch(url);
            var data = await res.json();
            if (!data || data.length === 0) throw new Error(`Adresse introuvable : "${adresseTexte}"`);
            return {
                lat: parseFloat(data[0].lat),
                lng: parseFloat(data[0].lon),
                nom: data[0].display_name.split(',')[0]
            };
        }

        async function calculerItineraire() {
            var departureInput = document.getElementById('departure').value.trim();
            var destinationInput = document.getElementById('destination').value.trim();
            var profil = document.getElementById('profile-select').value;
            var useTransit = document.getElementById('use-transit').checked;
            
            if (!departureInput || !destinationInput) return alert("Veuillez remplir le point de départ et l'arrivée.");

            document.getElementById('btn-calculer').disabled = true;
            document.getElementById('loading-indicator').style.display = "block";
            activeLayerGroup.clearLayers();

            try {
                var dep = await geocoderAdresse(departureInput);
                var arr = await geocoderAdresse(destinationInput);

                var succes = false;

                if (useTransit) {
                    // Tentative 1 : Avec le filtre PMR strict si demandé
                    try {
                        succes = await interrogerNavitia(dep.lat, dep.lng, arr.lat, arr.lng, profil, true);
                    } catch (e1) {
                        console.warn("Recherche PMR stricte sans résultat, tentative sur le réseau global...", e1);
                    }

                    // Tentative 2 : Sans filtre restrictif pour garantir un trajet complet (Métro/RER/Bus)
                    if (!succes) {
                        try {
                            succes = await interrogerNavitia(dep.lat, dep.lng, arr.lat, arr.lng, profil, false);
                        } catch (e2) {
                            console.warn("API IDFM indisponible, bascule sur le routage piéton certifié OSRM", e2);
                        }
                    }
                }

                // Si les transports ne renvoient rien ou sont décochés, routage piéton de secours
                if (!succes) {
                    await tracerMarcheSeule(dep.lat, dep.lng, arr.lat, arr.lng, profil);
                }

                L.marker([dep.lat, dep.lng]).addTo(activeLayerGroup).bindPopup(`<b>Départ :</b> ${dep.nom}`);
                L.marker([arr.lat, arr.lng]).addTo(activeLayerGroup).bindPopup(`<b>Arrivée :</b> ${arr.nom}`).openPopup();

            } catch (error) {
                alert("Erreur : " + error.message);
                console.error(error);
            }

            document.getElementById('btn-calculer').disabled = false;
            document.getElementById('loading-indicator').style.display = "none";
        }

        async function fetchIDFM(url) {
            var headers = { "Authorization": "apikey " + IDFM_API_KEY, "apiKey": IDFM_API_KEY };
            
            // Stratégie multi-proxy pour un usage réel en production locale ou hébergée
            try {
                let res = await fetch(url, { headers });
                if (res.ok) return await res.json();
            } catch(e) {}

            try {
                let res = await fetch("https://corsproxy.io/?" + encodeURIComponent(url), { headers });
                if (res.ok) return await res.json();
            } catch(e) {}

            try {
                let res = await fetch("https://api.allorigins.win/raw?url=" + encodeURIComponent(url));
                if (res.ok) return await res.json();
            } catch(e) {}

            throw new Error("Impossible de joindre l'API IDFM.");
        }

        // Interrogation complète de l'API Navitia (Tous modes : Bus, Métro, RER, Tram)
        async function interrogerNavitia(depLat, depLng, arrLat, arrLng, profil, strictPMR) {
            var wheelchairParam = (profil === 'pmr' && strictPMR) ? "&wheelchair=true" : "";
            var rawUrl = `https://prim.iledefrance-mobilites.fr/marketplace/navitia/v1/coverage/fr-idf/journeys?from=${depLng};${depLat}&to=${arrLng};${arrLat}${wheelchairParam}`;
            
            var data = await fetchIDFM(rawUrl);
            if (!data.journeys || data.journeys.length === 0) return false;

            var journey = data.journeys[0];
            var instructionsHtml = "";

            for (let section of journey.sections) {
                if (section.type === "public_transport" && section.display_informations) {
                    var color = "#" + (section.display_informations.color || "6366f1");
                    var codeLigne = section.display_informations.code || "LIGNE";
                    var reseau = section.display_informations.network || "IDFM";
                    var direction = section.display_informations.direction || "Destination";
                    var mode = section.display_informations.commercial_mode || "Transport";

                    instructionsHtml += `
                        <div class="instruction-step" style="border-color: ${color};">
                            <span class="badge-line" style="background-color: ${color};">${codeLigne}</span>
                            <strong>${reseau} (${mode})</strong> dir. ${direction}<br>
                            <small>De <b>${section.from.name}</b> à <b>${section.to.name}</b></small>
                            ${(profil === 'pmr') ? "<br><small style='color:#10b981;'>✓ Correspondance validée</small>" : ""}
                        </div>`;

                    if (section.geojson) {
                        L.geoJSON(section.geojson, {
                            style: { color: color, weight: 8, opacity: 0.9 }
                        }).addTo(activeLayerGroup);
                    }
                } 
                else if (section.type === "street_network" || section.type === "transfer" || section.type === "waiting") {
                    var min = Math.ceil((section.duration || 60) / 60);
                    if (min > 0) {
                        instructionsHtml += `
                            <div class="instruction-step" style="border-color: #10b981;">
                                🚶 Marche / Correspondance (~${min} min)
                            </div>`;
                    }

                    if (section.geojson) {
                        L.geoJSON(section.geojson, {
                            style: { color: "#10b981", weight: 5, dashArray: '6, 8', opacity: 0.9 }
                        }).addTo(activeLayerGroup);
                    } else if (section.from && section.to && section.from.coord && section.to.coord) {
                        try {
                            let osrmRes = await fetch(`https://router.project-osrm.org/route/v1/foot/${section.from.coord.lon},${section.from.coord.lat};${section.to.coord.lon},${section.to.coord.lat}?geometries=geojson`);
                            let osrmData = await osrmRes.json();
                            if (osrmData.routes && osrmData.routes.length > 0) {
                                let coords = osrmData.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
                                L.polyline(coords, { color: "#10b981", weight: 5, dashArray: '6, 8' }).addTo(activeLayerGroup);
                            }
                        } catch(e) {}
                    }
                }
            }

            if (!strictPMR && profil === 'pmr') {
                instructionsHtml = `<div class="instruction-step" style="border-color: #f59e0b; background: rgba(245, 158, 11, 0.1);"><small style="color: #f59e0b;">⚠ Itinéraire multimodal global (vérifier l'accessibilité de certaines stations historiques).</small></div>` + instructionsHtml;
            }

            document.getElementById('steps-list').innerHTML = instructionsHtml;
            document.getElementById('instructions-container').style.display = "block";

            var bounds = null;
            journey.sections.forEach(s => {
                if (s.geojson) {
                    let b = L.geoJSON(s.geojson).getBounds();
                    if (bounds) bounds.extend(b);
                    else bounds = b;
                }
            });
            if (bounds) map.fitBounds(bounds, { padding: [50, 50] });

            return true;
        }

        async function tracerMarcheSeule(depLat, depLng, arrLat, arrLng, profil) {
            var url = `https://router.project-osrm.org/route/v1/foot/${depLng},${depLat};${arrLng},${arrLng}?geometries=geojson`;
            var res = await fetch(url);
            var data = await res.json();

            if (!data.routes || data.routes.length === 0) throw new Error("Impossible de calculer l'itinéraire piéton.");

            var coords = data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
            var color = profil === 'malvoyant' ? "#f59e0b" : "#10b981";

            var poly = L.polyline(coords, { color: color, weight: 6, dashArray: profil === 'malvoyant' ? '8, 8' : null }).addTo(activeLayerGroup);
            var min = Math.round(data.routes[0].duration / 60);

            document.getElementById('steps-list').innerHTML = `
                <div class="instruction-step" style="border-color: #10b981;">
                    🚶 <strong>Cheminement piéton direct :</strong> Suivi des trottoirs et voiries adaptés (~${min} min).
                </div>`;
            document.getElementById('instructions-container').style.display = "block";

            map.fitBounds(poly.getBounds(), { padding: [50, 50] });
        }
    </script>
</body>
</html>
