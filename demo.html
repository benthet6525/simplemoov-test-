<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimpleMoov - Démo Interactive AccessiRoute</title>
    <link rel="stylesheet" href="style.css">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <style>
        .demo-container { max-width: 1200px; margin: 2rem auto; padding: 0 5%; }
        .map-layout {
            display: grid; grid-template-columns: 380px 1fr; gap: 2rem;
            background: var(--card-bg); border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.05); overflow: hidden; margin-top: 1.5rem;
        }
        .map-sidebar {
            padding: 2rem; background: rgba(15, 23, 42, 0.7); border-right: 1px solid rgba(255, 255, 255, 0.05);
            display: flex; flex-direction: column; gap: 1.2rem; max-height: 680px; overflow-y: auto;
        }
        .filter-group label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.4rem; }
        .filter-group select, .filter-group input {
            width: 100%; padding: 0.7rem; border-radius: 8px; background: var(--bg-color);
            border: 1px solid rgba(255, 255, 255, 0.1); color: var(--text-main); font-size: 0.9rem;
        }
        .checkbox-group {
            display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; color: var(--text-main);
            background: rgba(99, 102, 241, 0.1); padding: 0.8rem; border-radius: 8px; border: 1px solid rgba(99, 102, 241, 0.3);
        }
        .route-instructions {
            background: rgba(15, 23, 42, 0.95); border: 1px solid rgba(99, 102, 241, 0.4);
            border-radius: 10px; padding: 1rem; font-size: 0.85rem; color: var(--text-muted);
        }
        .instruction-step {
            margin-bottom: 0.8rem; padding-left: 0.8rem; border-left: 3px solid var(--primary);
        }
        .badge-metro {
            display: inline-block; padding: 2px 6px; border-radius: 4px; color: #fff; font-weight: bold; font-size: 0.75rem; margin-right: 5px;
        }
        #map { width: 100%; height: 680px; background: #1e293b; min-height: 400px; }
        .loading-text { color: var(--primary); font-size: 0.9rem; font-weight: bold; display: none; }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <a href="index.html" style="text-decoration: none;"><h1>SimpleMoov</h1></a>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Accueil</a></li>
                <li><a href="fonctionnalites.html">Fonctionnalités</a></li>
                <li><a href="demo.html" class="active" style="color: var(--text-main);">Démo Live</a></li>
                <li><a href="contact.html" class="btn-cta">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="demo-container">
        <h2>Démo Interactive d'AccessiRoute</h2>
        
        <div class="map-layout">
            <div class="map-sidebar">
                <h3>Paramètres du Trajet</h3>
                
                <div class="filter-group">
                    <label for="profile-select">Profil de Mobilité :</label>
                    <select id="profile-select">
                        <option value="pmr">Fauteuil Roulant (PMR) - Transports accessibles</option>
                        <option value="malvoyant">Déficience Visuelle</option>
                        <option value="senior">Senior / Mobilité réduite</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="departure">Point de départ (Île-de-France) :</label>
                    <input type="text" id="departure" value="Gare Montparnasse, Paris" placeholder="Ex: Gare de Lyon, 12 rue de Rivoli...">
                </div>

                <div class="filter-group">
                    <label for="destination">Point d'arrivée (Île-de-France) :</label>
                    <input type="text" id="destination" value="Musée du Louvre, Paris" placeholder="Ex: Tour Eiffel, Châtelet...">
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="use-transit" checked>
                    <label for="use-transit">Utiliser les Transports en Commun (IDFM)</label>
                </div>

                <button id="btn-calculer" class="btn-primary" style="width: 100%; padding: 10px; cursor: pointer;" onclick="calculerItineraire()">Calculer le trajet sécurisé</button>
                <div id="loading-indicator" class="loading-text">Recherche & géocodage en cours...</div>

                <div id="instructions-container" class="route-instructions" style="display: none;">
                    <h4 style="color: white; margin-bottom: 10px;">Feuille de route :</h4>
                    <div id="steps-list"></div>
                </div>
            </div>

            <!-- Conteneur de la Carte -->
            <div id="map"></div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 SimpleMoov (AccessiRoute). Tous droits réservés.</p>
    </footer>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script>
        const IDFM_API_KEY = "zOTwROW5XQ4sWfbtreradCC4PGIFGcoV";
        
        var map = L.map('map').setView([48.8566, 2.3522], 12);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
        var activeLayerGroup = L.layerGroup().addTo(map);

        async function geocoderAdresse(adresseTexte) {
            var url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(adresseTexte + ", Île-de-France, France")}&limit=1`;
            var res = await fetch(url);
            var data = await res.json();
            if (!data || data.length === 0) {
                throw new Error(`Adresse introuvable : "${adresseTexte}"`);
            }
            return {
                lat: parseFloat(data[0].lat),
                lng: parseFloat(data[0].lon),
                nomComplet: data[0].display_name
            };
        }

        async function calculerItineraire() {
            var departureInput = document.getElementById('departure').value.trim();
            var destinationInput = document.getElementById('destination').value.trim();
            var profil = document.getElementById('profile-select').value;
            var useTransit = document.getElementById('use-transit').checked;
            
            if (!departureInput || !destinationInput) {
                alert("Veuillez remplir le point de départ ET le point d'arrivée.");
                return;
            }

            document.getElementById('btn-calculer').disabled = true;
            document.getElementById('loading-indicator').style.display = "block";
            activeLayerGroup.clearLayers();

            try {
                var pointDepart = await geocoderAdresse(departureInput);
                var pointArrivee = await geocoderAdresse(destinationInput);

                if (useTransit) {
                    try {
                        await tracerNavitia(pointDepart.lat, pointDepart.lng, pointArrivee.lat, pointArrivee.lng, profil);
                    } catch (idfmErr) {
                        console.warn("API IDFM indisponible, bascule automatique sur le tracé piéton :", idfmErr);
                        await tracerMarcheSeule(pointDepart.lat, pointDepart.lng, pointArrivee.lat, pointArrivee.lng, profil);
                    }
                } else {
                    await tracerMarcheSeule(pointDepart.lat, pointDepart.lng, pointArrivee.lat, pointArrivee.lng, profil);
                }

                L.marker([pointDepart.lat, pointDepart.lng]).addTo(activeLayerGroup)
                 .bindPopup(`<b>Départ :</b><br>${pointDepart.nomComplet}`);
                 
                L.marker([pointArrivee.lat, pointArrivee.lng]).addTo(activeLayerGroup)
                 .bindPopup(`<b>Arrivée :</b><br>${pointArrivee.nomComplet}`).openPopup();

            } catch (error) {
                alert("Erreur : " + error.message);
                console.error(error);
            }

            document.getElementById('btn-calculer').disabled = false;
            document.getElementById('loading-indicator').style.display = "none";
        }

        async function tracerNavitia(depLat, depLng, arrLat, arrLng, profil) {
            var wheelchairParam = profil === 'pmr' ? "&wheelchair=true" : "";
            var rawUrl = `https://prim.iledefrance-mobilites.fr/marketplace/navitia/v1/coverage/fr-idf/journeys?from=${depLng};${depLat}&to=${arrLng};${arrLat}${wheelchairParam}&forbidden_uris[]=physical_mode:Bicycle`;

            var proxyUrl = "https://corsproxy.io/?" + encodeURIComponent(rawUrl);

            var response = await fetch(proxyUrl, {
                method: "GET",
                headers: { 
                    "apiKey": IDFM_API_KEY,
                    "apikey": IDFM_API_KEY 
                }
            });

            if (!response.ok) {
                throw new Error(`Erreur API IDFM (HTTP ${response.status})`);
            }

            var data = await response.json();
            if (!data.journeys || data.journeys.length === 0) {
                throw new Error("Aucun itinéraire trouvé.");
            }

            var journey = data.journeys[0];
            var instructionsHtml = "";
            var stepsList = document.getElementById('steps-list');

            journey.sections.forEach(section => {
                if (!section.geojson) return;

                var color = profil === 'malvoyant' ? "#f59e0b" : "#10b981"; 
                var weight = 5;
                var dash = '6, 8'; 

                if (section.type === "public_transport" && section.display_informations) {
                    color = "#" + section.display_informations.color;
                    weight = 8;
                    dash = null;

                    var codeLigne = section.display_informations.code;
                    var nomLigne = section.display_informations.network;
                    var direction = section.display_informations.direction;
                    
                    instructionsHtml += `
                        <div class="instruction-step" style="border-color: ${color};">
                            <span class="badge-metro" style="background-color: ${color};">${codeLigne}</span>
                            <strong>${nomLigne}</strong> direction ${direction}<br>
                            <small>De <b>${section.from.name}</b> à <b>${section.to.name}</b></small>
                            ${profil === 'pmr' ? "<br><small style='color:#10b981;'>✓ Tracé accessible PMR</small>" : ""}
                        </div>`;
                } 
                else if (section.type === "street_network") {
                    var minutes = Math.ceil(section.duration / 60);
                    instructionsHtml += `
                        <div class="instruction-step" style="border-color: ${color};">
                            🚶 Marcher environ ${minutes} min
                        </div>`;
                }

                L.geoJSON(section.geojson, {
                    style: { color: color, weight: weight, dashArray: dash, opacity: 0.9 }
                }).addTo(activeLayerGroup);
            });

            stepsList.innerHTML = instructionsHtml;
            document.getElementById('instructions-container').style.display = "block";

            var firstGeoJSON = L.geoJSON(journey.sections[0].geojson);
            var bounds = firstGeoJSON.getBounds();
            journey.sections.forEach(s => { 
                if (s.geojson) bounds.extend(L.geoJSON(s.geojson).getBounds()); 
            });
            map.fitBounds(bounds, { padding: [50, 50] });
        }

        async function tracerMarcheSeule(depLat, depLng, arrLat, arrLng, profil) {
            var url = `https://router.project-osrm.org/route/v1/foot/${depLng},${depLat};${arrLng},${arrLat}?geometries=geojson`;
            var res = await fetch(url);
            var data = await res.json();

            if (data.code !== "Ok") throw new Error("Impossible de calculer un itinéraire piéton.");

            var coords = data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
            var color = profil === 'malvoyant' ? "#f59e0b" : "#10b981";

            var poly = L.polyline(coords, { 
                color: color, 
                weight: 6, 
                dashArray: profil === 'malvoyant' ? '8, 8' : null 
            }).addTo(activeLayerGroup);

            var minutesTotal = Math.round(data.routes[0].duration / 60);

            document.getElementById('steps-list').innerHTML = `
                <div class="instruction-step">🚶 Trajet piéton direct (~${minutesTotal} min).</div>`;
            document.getElementById('instructions-container').style.display = "block";

            map.fitBounds(poly.getBounds(), { padding: [50, 50] });
        }
    </script>
</body>
</html>
